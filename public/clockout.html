<!doctype html>
<!--
  Clock-out calculator.

  Answers one question: given the time you came back from lunch and the decimal
  hours your timeclock already shows, when do you hit your target?

  WHY THIS EXISTS ALONGSIDE clockmaker.html. That one takes three timestamps -
  clock in, lunch out, lunch back - and works out the lunch break itself. This
  one doesn't need to: the timeclock has already computed and subtracted lunch,
  and hands you a decimal like 4.02. Two inputs instead of three.

  THE TWO THINGS THAT MAKE THIS WRONG IF YOU RUSH IT, both handled in
  computeClockOut() below:

    1. Decimal hours are not minutes. .02 hr is 1.2 minutes, not 2. Anything
       that reads the decimal part as minutes is wrong by up to 36 minutes.
    2. Round to the nearest minute ONCE, at the end. 4.02 hr leaves 3 h 58.8 m,
       and truncating (which is what most duration formatting does, including
       Python's timedelta) reports 4:23 PM instead of 4:24 PM.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock-out calculator</title>
<meta name="description" content="Work out when to clock out: enter the time you came back from lunch and the decimal hours your timeclock shows, and it gives you the time you hit 8 hours - or any weekly target.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #edf1f1;
    --card: #f8fbfb;
    --border: rgba(40, 64, 74, 0.14);
    --ink: #2a3743;
    --muted: #5c6d75;
    --teal: #3a6f6b;
    --accent: #22505a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1418;
      --card: #141e23;
      --border: rgba(255, 255, 255, 0.1);
      --ink: #bcccce;
      --muted: #7f9296;
      --teal: #5fb4ae;
      --accent: #7bceca;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
  }

  main {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 24px 22px;
  }

  h1 { margin: 0 0 4px; font-size: 19px; color: var(--ink); }
  .lede { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }

  /* The mode switch: two radios drawn as one segmented control. */
  .modes { display: flex; gap: 0; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .modes label { flex: 1; }
  .modes input { position: absolute; opacity: 0; pointer-events: none; }
  .modes span {
    display: block; text-align: center; padding: 9px 8px; font-size: 13.5px;
    cursor: pointer; color: var(--muted); transition: background 0.15s, color 0.15s;
  }
  .modes input:checked + span { background: var(--teal); color: #fff; font-weight: 600; }
  /* Keyboard users must still be able to see which one has focus. */
  .modes input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: -3px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .field .hint { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  input[type="time"], input[type="number"] {
    width: 100%; padding: 10px 12px; font-size: 16px; font-family: inherit;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
  }
  input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }

  .result { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center; }
  .result .label { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .result .time { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 6px; color: var(--teal); }
  /* The working, kept visible on purpose - it is what catches an arithmetic
     slip before you trust the number and go home late. */
  .result .work { font-size: 13px; color: var(--muted); min-height: 1.6em; }
  .result .over { color: var(--accent); font-weight: 600; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>When do I clock out?</h1>
  <p class="lede">Uses the decimal hours your timeclock already shows - it has taken lunch off for you.</p>

  <div class="modes" role="radiogroup" aria-label="Target">
    <label>
      <input type="radio" name="mode" value="daily" id="modeDaily" checked>
      <span>Daily 8 h</span>
    </label>
    <label>
      <input type="radio" name="mode" value="weekly" id="modeWeekly">
      <span>Weekly target</span>
    </label>
  </div>

  <div class="field" id="targetField" hidden>
    <label for="target">Target for the period
      <span class="hint">Hours - e.g. 24, 40, 72, 80</span>
    </label>
    <input type="number" id="target" value="40" min="0" step="0.01" inputmode="decimal">
  </div>

  <div class="field">
    <label for="backIn">Back in from lunch</label>
    <input type="time" id="backIn">
  </div>

  <div class="field">
    <label for="worked" id="workedLabel">Hours worked so far
      <span class="hint" id="workedHint">The decimal on your timeclock - e.g. 4.02</span>
    </label>
    <input type="number" id="worked" min="0" step="0.01" inputmode="decimal" placeholder="4.02">
  </div>

  <div class="result">
    <div class="label">Clock out at</div>
    <div class="time" id="out" aria-live="polite">–:–</div>
    <div class="work" id="work"></div>
  </div>
</main>

<script>
/* ── The maths ─────────────────────────────────────────────────────────────
   Pure, and separated from the DOM so the tests can call it directly
   (window.__clockout at the bottom of this file). */

/**
 * @param {number} backInMin   minutes since midnight you clocked back in
 * @param {number} hoursWorked decimal hours already on the clock
 * @param {number} targetHours 8 for a day, or the period's target
 */
function computeClockOut(backInMin, hoursWorked, targetHours) {
  /* ROUND ONCE, AT THE END, AND TO THE NEAREST MINUTE.
     4.02 hr worked against 8 leaves 3.98 hr = 238.8 minutes. Rounded: 239, so
     12:25 PM + 3 h 59 m = 4:24 PM. Truncating gives 238 and an answer a minute
     early - which is the difference between 4:24 and 4:23, and the reason this
     is a single expression rather than a chain of intermediate roundings. */
  const remainingMins = Math.round((targetHours - hoursWorked) * 60);

  /* Derived by subtraction rather than rounded separately, so the two halves
     of the "check" line always add up to the target exactly. Rounding both
     independently can disagree by a minute when either lands on a .5. */
  const targetMins = Math.round(targetHours * 60);
  const workedMins = targetMins - remainingMins;

  return { remainingMins, workedMins, clockOutMin: backInMin + remainingMins };
}

/** "16:24" (a time input's 24-hour value) → minutes since midnight. */
function toMinutes(value) {
  const match = /^(\d{1,2}):(\d{2})$/.exec(value ?? "");
  if (!match) return null;
  return Number(match[1]) * 60 + Number(match[2]);
}

/** Minutes since midnight → "4:24 PM", wrapping past midnight. */
function fmt12(totalMins) {
  const mins = ((Math.round(totalMins) % 1440) + 1440) % 1440;
  const hour24 = Math.floor(mins / 60);
  const hour12 = hour24 % 12 === 0 ? 12 : hour24 % 12;
  return `${hour12}:${String(mins % 60).padStart(2, "0")} ${hour24 < 12 ? "AM" : "PM"}`;
}

/** 239 → "3h 59m". Whole hours drop the minutes: 240 → "4h". */
function fmtDur(mins) {
  const total = Math.abs(Math.round(mins));
  const h = Math.floor(total / 60);
  const m = total % 60;
  if (h === 0) return `${m}m`;
  return m === 0 ? `${h}h` : `${h}h ${m}m`;
}

/* ── Wiring ──────────────────────────────────────────────────────────────── */

const $ = (id) => document.getElementById(id);

function currentTarget() {
  return $("modeWeekly").checked ? Number($("target").value) : 8;
}

function render() {
  const weekly = $("modeWeekly").checked;
  $("targetField").hidden = !weekly;
  $("workedLabel").firstChild.textContent = weekly
    ? "Hours worked this period "
    : "Hours worked so far ";
  $("workedHint").textContent = weekly
    ? "The period total on your timeclock"
    : "The decimal on your timeclock - e.g. 4.02";

  const backInMin = toMinutes($("backIn").value);
  const hoursWorked = Number($("worked").value);
  const targetHours = currentTarget();
  const ready =
    backInMin !== null && $("worked").value !== "" && Number.isFinite(hoursWorked) &&
    Number.isFinite(targetHours) && targetHours > 0;

  if (!ready) {
    $("out").textContent = "–:–";
    $("work").textContent = "";
    return;
  }

  const { remainingMins, workedMins, clockOutMin } = computeClockOut(
    backInMin, hoursWorked, targetHours,
  );

  if (remainingMins <= 0) {
    /* Already at or past the target - the useful answer is by how much, not a
       clock time in the past. */
    $("out").textContent = fmt12(clockOutMin);
    $("work").innerHTML =
      `<span class="over">Target already met</span> · ` +
      `${hoursWorked} hr of ${targetHours} · ${fmtDur(remainingMins)} over`;
    return;
  }

  $("out").textContent = fmt12(clockOutMin);
  $("work").textContent =
    `${hoursWorked} hr worked (${fmtDur(workedMins)}) · ${fmtDur(remainingMins)} remaining`;
}

for (const id of ["backIn", "worked", "target", "modeDaily", "modeWeekly"]) {
  $(id).addEventListener("input", render);
  $(id).addEventListener("change", render);
}
render();

/* Exposed for tests/clockout.spec.ts - the maths is the part worth guarding,
   and it is far easier to assert on directly than through the inputs. */
window.__clockout = { computeClockOut, toMinutes, fmt12, fmtDur };
</script>
</body>
</html>
