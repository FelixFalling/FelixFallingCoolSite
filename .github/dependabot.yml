# Keeps dependencies and CI actions current, automatically.
#
# WHY THIS FILE EXISTS. The workflows in this folder pin every action to a full
# commit SHA rather than to a tag like @v4. A tag is a movable pointer - whoever
# controls the action's repository can repoint it at different code, and every
# workflow using that tag picks the new code up on its next run without anything
# changing here. That is not theoretical; it is how several real supply-chain
# attacks on GitHub Actions have worked. A SHA cannot be moved.
#
# The cost of pinning is that pins go stale, including security fixes. This file
# is what pays that cost: Dependabot understands a SHA pin followed by a
# `# v4.4.0` comment, and opens a pull request that updates BOTH the SHA and the
# comment when a new release appears. So the pins stay both immovable and fresh,
# and every update arrives as a reviewable diff instead of silently.
#
# The npm entry does the same for the packages in package.json.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    # One PR per week per ecosystem is plenty for a personal site; this stops a
    # quiet week upstream from turning into a wall of pull requests.
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps for the toolchain arrive as a single PR, because
      # reviewing "@types/node 22.10.7 → 22.10.8" on its own is not a good use
      # of anyone's attention. Major versions are deliberately NOT grouped:
      # those deserve to be read one at a time.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
