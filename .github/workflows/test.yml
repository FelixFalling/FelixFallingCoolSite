# Lints, type-checks, builds, and runs the Playwright suite on every push and
# pull request.
#
# This is separate from the deploy workflow (static.yml) on purpose: deploys
# stay simple and never get blocked by a flaky test, while this workflow gives
# you a green check / red X on every commit and PR. If you later want failing
# tests to BLOCK deploys, the cleanest way is branch protection on main
# requiring this check to pass.
#
# WHY THE BUILD STEP IS HERE: `npm test` starts the DEV server, which does not
# fail on a type error. So before this step existed, a commit that broke
# `npm run build` sailed through green here and only failed later in the deploy
# workflow - which runs after the merge, not before. That happened for real
# (commit 5dcf019 removed a required field from resume.ts, the deploy failed,
# and the live site silently went stale). Building here catches it first.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: # the "Run workflow" button in the Actions tab

# LEAST PRIVILEGE. Without this block a workflow inherits the repository's
# default token permissions, which for many repos is read AND WRITE across
# contents, packages, issues and pull requests. This job only ever needs to
# read the code it is testing.
#
# It matters most for the `pull_request` trigger above. A pull request runs
# code written by whoever opened it; if that job also holds a token that can
# push, the token is one malicious `npm` lifecycle script away from writing to
# the repository. (Forked PRs are already given a read-only token by GitHub -
# this closes the same hole for branches pushed inside the repo, and states the
# intent so a future default change cannot quietly widen it.)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite has grown from two browser projects to five, and runs on one
    # worker on a two-core runner: measured runs sit at 13-15 minutes, and two
    # of them were killed outright by a 15-minute cap. Raised with room rather
    # than trimmed, because the coverage is worth the wall clock - but if this
    # ever needs raising again, that is the signal to shard instead.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first so an obvious mistake fails in seconds rather
      # than after a full browser run. Each is a separate step so the run page
      # shows exactly which one broke.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build (the production static export)
        run: npm run build

      # The Chrome projects use the runner's preinstalled Google Chrome, but
      # WebKit (the Safari engine) is a browser Playwright has to download.
      # --with-deps also pulls the system libraries it needs on Ubuntu.
      - name: Install WebKit for the Safari projects
        run: npx playwright install webkit --with-deps

      # The Playwright config uses channel "chrome" - GitHub's runners already
      # have Chrome installed, so there's no browser download step.
      - name: Run Playwright tests
        run: npm test

      # When a test fails, the HTML report (screenshots, traces, every step) is
      # saved as a downloadable artifact on the run page - open it locally with
      # `npx playwright show-report <unzipped folder>`.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
