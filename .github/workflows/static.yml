# Builds the Next.js site and deploys the static export to GitHub Pages.
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# LEAST PRIVILEGE, TWICE OVER. The default for the whole workflow is read-only;
# the write permissions Pages needs are granted to the deploy job alone, below.
#
# The split matters because the two jobs run very different code. `build` runs
# `npm ci` and `npm run build`, which execute this project's dependencies and
# their install scripts - hundreds of packages' worth of third-party code. If
# that job also held `pages: write` and `id-token: write`, any one of them could
# publish to the live site or mint an OIDC token in this repository's name.
# `deploy` runs no project code at all: it only hands the already-built artifact
# to GitHub's own action, so it is the job that can safely hold the keys.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1) Build the static site into ./out
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build # `output: 'export'` in next.config.mjs writes ./out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./out

  # 2) Deploy the built artifact
  deploy:
    needs: build
    # The only place in this repository that can write to the live site.
    permissions:
      pages: write # publish the artifact
      id-token: write # prove to Pages that this workflow is the one deploying
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
